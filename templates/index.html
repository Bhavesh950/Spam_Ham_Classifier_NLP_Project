<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpamShield AI - Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-500 font-sans antialiased">
    
    <!-- Theme Toggle -->
    <div class="fixed top-8 right-8 z-50">
        <button id="themeToggle" class="p-3 rounded-2xl bg-white dark:bg-slate-900 shadow-xl border border-slate-100 dark:border-slate-800 hover:scale-110 active:scale-95 transition-all cursor-pointer">
            <span id="themeIcon">☀️</span>
        </button>
    </div>

    <main class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-indigo-500/10 via-transparent to-transparent">
        <div class="w-full max-w-2xl">
            <!-- Branding -->
            <div class="text-center mb-12">
                <div class="inline-flex items-center justify-center p-4 mb-6 rounded-3xl bg-indigo-600/10 text-indigo-500 ring-1 ring-indigo-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h1 class="text-5xl font-extrabold tracking-tight mb-3 bg-gradient-to-r from-slate-900 to-slate-500 dark:from-white dark:to-slate-400 bg-clip-text text-transparent">SpamShield AI</h1>
                <p class="text-lg text-slate-500 dark:text-slate-400">Military-grade classification for your messages.</p>
            </div>

            <!-- Input Container -->
            <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-[2.5rem] p-10 shadow-2xl border border-slate-200/50 dark:border-slate-800/50 relative">
                <form action="/predict" method="POST" id="predictForm" class="space-y-8">
                    <div class="relative">
                        <textarea 
                            name="message" 
                            id="messageInput" 
                            rows="7" 
                            placeholder="Paste your email or sensitive message here..."
                            class="w-full p-8 rounded-3xl bg-slate-50 dark:bg-slate-800/40 border-2 border-transparent focus:border-indigo-500/50 dark:focus:border-indigo-500/30 ring-0 focus:ring-0 outline-none transition-all resize-none text-lg leading-relaxed dark:text-slate-200 placeholder:text-slate-400"
                        >{{ message if message }}</textarea>
                    </div>

                    <div class="flex gap-5 items-stretch">
                        <button type="submit" class="flex-1 bg-gradient-to-br from-indigo-600 to-violet-700 hover:from-indigo-500 hover:to-violet-600 text-white font-bold py-5 px-8 rounded-3xl shadow-lg shadow-indigo-500/30 transition-all active:scale-[0.98] flex items-center justify-center gap-3 text-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            Analyze Message
                        </button>
                        <button type="button" id="resetBtn" class="px-6 rounded-3xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center group active:scale-95" title="Clear All">
                            <svg class="group-hover:rotate-180 transition-transform duration-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                        </button>
                    </div>
                </form>

                {% if prediction %}
                <div class="mt-10 pt-10 border-t border-slate-100 dark:border-slate-800 animation-slide-up">
                    <div class="flex flex-col items-center p-8 rounded-3xl {% if prediction == 'Spam' %}bg-rose-500/10 text-rose-600 dark:text-rose-400 ring-1 ring-rose-500/20{% else %}bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 ring-1 ring-emerald-500/20{% endif %}">
                        <div class="mb-3">
                            {% if prediction == 'Spam' %}
                            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            {% else %}
                            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            {% endif %}
                        </div>
                        <span class="text-xs font-bold uppercase tracking-[0.2em] opacity-60 mb-2">Analysis Result</span>
                        <h3 class="text-4xl font-black">{{ prediction }}</h3>
                    </div>
                </div>
                {% endif %}
            </div>

            <footer class="mt-16 text-center space-y-4">
                <p class="text-slate-400 dark:text-slate-600 text-sm font-medium tracking-wide">SECURE CLASSIFICATION ENGINE v1.0</p>
                <div class="flex justify-center gap-6 text-slate-300 dark:text-slate-800">
                    <div class="h-1 w-12 bg-current rounded-full"></div>
                    <div class="h-1 w-12 bg-current rounded-full"></div>
                    <div class="h-1 w-12 bg-current rounded-full"></div>
                </div>
            </footer>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
